      </div>
      <div class="gallery-item">
        <img class="gallery-img" src="images/gallery-2-ocean.svg" alt="Ocean" />

      <div class="gallery-item">
        <img class="gallery-img" src="images/gallery-3-forest.svg" alt="Forest" />

      </div>
      <div class="gallery-item">
        <img class="gallery-img" src="images/gallery-4-desert.svg" alt="Desert" />
        <div class="gallery-caption">Desert</div>
      </div>
      <div class="gallery-item">
        <img class="gallery-img" src="images/gallery-5-city.svg" alt="City" />
        <div class="gallery-caption">City</div>
      </div>
      <div class="gallery-item">
        <img class="gallery-img" src="images/gallery-6-sunset.svg" alt="Sunset" />
        <div class="gallery-caption">Sunset</div>
      </div>
      <div class="gallery-item">
        <img class="gallery-img" src="images/gallery-7-lake.svg" alt="Lake" />
        <div class="gallery-caption">Lake</div>
      </div>
      <div class="gallery-item">
        <img class="gallery-img" src="images/gallery-8-snow.svg" alt="Snow" />
        <div class="gallery-caption">Snow</div>
      </div>
      <div class="gallery-item">
        <img class="gallery-img" src="images/gallery-9-valley.svg" alt="Valley" />
        <div class="gallery-caption">Valley</div>
      </div>
    </div>

  <footer class="site-footer">Assignment #2 - Fariddin, Group 4</footer>
